version: 2
updates:
  # Следим за двумя SDK движков: внутри каждого лежит бинарник своего CLI, который
  # разворачивает алиас модели в конкретный ID. Свежий SDK = свежая модель и свежий
  # харнесс. Остальные зависимости бампаем руками по необходимости.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "claude-agent-sdk"
      - dependency-name: "openai-codex"
