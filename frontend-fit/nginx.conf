server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Поток живой синхронизации: не буферизовать, иначе события копятся в nginx.
    # ^~ важнее блока /fit ниже.
    location ^~ /fit/events {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    location /fit {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 5m;
    }

    # Распознавание речи для голосового ввода в чате.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120;
        client_max_body_size 25m;
    }

    location /chat/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Сервис-воркер проверяется при каждом заходе: закэшированный воркер — это приложение,
    # которое не обновится, пока кэш не протухнет.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Имена собранных файлов содержат хеш — их можно кэшировать навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
