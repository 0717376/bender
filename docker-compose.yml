# BENDER_TAG выбирает, откуда берутся образы: `local` — сборка из исходников
# (`up -d --build`), любой другой тег — готовые образы из GHCR (`pull` + `up -d --no-build`).
# Переключает и то и другое ./bender update, руками лезть сюда не нужно.
services:
  backend:
    image: ghcr.io/0717376/bender-backend:${BENDER_TAG:-local}
    build: ./backend
    expose:
      - "8000"
    volumes:
      - ./content:/app/content        # md-страницы вики (видны на хосте)
      - ./data:/app/data              # session, tasks.db, cron.db, memory, навыки
      - ./files:/app/files            # файловое хранилище (документы пользователя)
      - ./books:/app/books            # библиотека читалки: epub и их производные
      - ./tg-bot-api:/var/lib/telegram-bot-api:ro  # файлы локального bot-api (пути из getFile)
      - ${CLAUDE_DIR:-~/.claude}:/root/.claude          # креды Claude CLI (рефреш токена сюда)
      - ${CLAUDE_JSON:-~/.claude.json}:/seed/.claude.json:ro  # конфиг-seed (копируется в HOME при старте)
    environment:
      - WIKI_PASSWORD=${WIKI_PASSWORD}
      # На чём ходит агент: claude (подписка Max) или codex (подписка ChatGPT).
      # Всё остальное — вики, задачи, книги, крон, память, навыки — общее.
      - ENGINE=${ENGINE:-claude}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-sonnet}
      # Пусто — модель, которую Codex выберет сам. Логин лежит в data/codex (том),
      # заводится командой ./bender login и переживает обновления.
      - CODEX_MODEL=${CODEX_MODEL:-}
      # Долгоживущий токен из `claude setup-token` (год). Задан — CLI авторизуется им и не
      # зависит от OAuth-сессии в ~/.claude: на headless-хосте она однажды не обновляется
      # и умирает молча, а агент начинает отвечать «Failed to authenticate».
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_IDS=${TELEGRAM_ALLOWED_IDS:-}
      - TG_API_BASE=${TG_API_BASE:-https://api.telegram.org}
      - ASR_UPSTREAM=${ASR_UPSTREAM:-}
      - ASR_MODEL=${ASR_MODEL:-gigaam-rnnt}
      - TZ=${TZ:-Europe/Moscow}
      - CURATOR_ENABLED=${CURATOR_ENABLED:-1}
      - CURATOR_INTERVAL_HOURS=${CURATOR_INTERVAL_HOURS:-168}
      - CURATOR_MIN_IDLE_HOURS=${CURATOR_MIN_IDLE_HOURS:-2}
      - SESSION_FRESH_HOURS=${SESSION_FRESH_HOURS:-6}
      - REVIEWER_ENABLED=${REVIEWER_ENABLED:-1}
      - REVIEWER_MODEL=${REVIEWER_MODEL:-sonnet}
    restart: unless-stopped

  # Локальный Bot API: лимиты файлов 2 ГБ вместо 20/50 МБ. Включается, когда в .env
  # заданы TELEGRAM_API_ID/TELEGRAM_API_HASH (my.telegram.org) и TG_API_BASE=http://tgapi:8081.
  tgapi:
    image: aiogram/telegram-bot-api:latest
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_LOCAL=true
    volumes:
      - ./tg-bot-api:/var/lib/telegram-bot-api
    restart: unless-stopped

  # Контекст — корень репо: фронтендам нужен общий design/tokens.css
  frontend-wiki:
    image: ghcr.io/0717376/bender-wiki:${BENDER_TAG:-local}
    build:
      context: .
      dockerfile: frontend-wiki/Dockerfile
    ports:
      - "${WIKI_PORT:-8842}:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-tasks:
    image: ghcr.io/0717376/bender-tasks:${BENDER_TAG:-local}
    build:
      context: .
      dockerfile: frontend-tasks/Dockerfile
    ports:
      - "${TASKS_PORT:-8851}:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-books:
    image: ghcr.io/0717376/bender-books:${BENDER_TAG:-local}
    build:
      context: .
      dockerfile: frontend-books/Dockerfile
    ports:
      - "${BOOKS_PORT:-8899}:80"
    depends_on:
      - backend
    restart: unless-stopped
