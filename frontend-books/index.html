<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Книги">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBFAF8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Книги</title>
</head>
<body>

<svg style="display:none">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></symbol>
  <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-lang" viewBox="0 0 24 24"><path d="M5 8h9M9 5v3c0 4-2 7-5 9M8 12c1 3 3 5 6 6M14 21l4-9 4 9M15.6 18h4.8"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.6 10.8c.5.4.8.9.9 1.2h5.4c.1-.3.4-.8.9-1.2A6 6 0 0012 3z"/></symbol>
  <symbol id="i-ask" viewBox="0 0 24 24"><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3M12 17h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
  <symbol id="i-wiki" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 9h10v12H9zM5 15H3V3h12v2"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M12 6h.01M12 12h.01M12 18h.01"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.14.31.4.55.71.68.31.13.65.16.98.09H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2zM22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 01-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 015.4-5.4l-2.6 2.6-1.4-1.4z"/></symbol>
</svg>

<div id="splash">открываю…</div>

<div id="auth">
  <div class="auth-box">
    <div class="mark"><svg class="icon"><use href="#i-book"/></svg></div>
    <h1>Книги</h1>
    <p>Читалка с агентом. Пароль тот же, что у вики.</p>
    <div class="field">
      <input id="authPass" type="password" placeholder="Пароль" autocomplete="current-password">
      <button class="btn" id="authGo">Войти</button>
    </div>
    <div class="auth-err" id="authErr"></div>
  </div>
</div>

<div id="shelf" class="screen">
  <div class="wrap">
    <div class="shelf-head">
      <div>
        <h1>Книги</h1>
        <div class="sub" id="shelfSub"></div>
      </div>
      <div class="head-acts">
        <button class="tb" id="btnAdd" title="Добавить книгу"><svg class="icon"><use href="#i-plus"/></svg></button>
        <button class="tb" id="btnPrefs" title="Настройки"><svg class="icon"><use href="#i-gear"/></svg></button>
      </div>
    </div>
    <div id="heroSlot"></div>
    <div id="gridWrap"></div>
  </div>
</div>

<div id="reader">
  <div class="chrome" id="topbar">
    <button class="tb" id="btnBack"><svg class="icon"><use href="#i-back"/></svg></button>
    <div id="bookTitle"></div>
    <button class="tb" id="btnToc"><svg class="icon"><use href="#i-list"/></svg></button>
    <button class="tb" id="btnHl"><svg class="icon"><use href="#i-mark"/></svg></button>
    <button class="tb" id="btnSet"><svg class="icon"><use href="#i-type"/></svg></button>
  </div>
  <div id="viewer"></div>
  <div class="chrome" id="botbar">
    <span id="chapLabel"></span><span class="mid" id="pageInfo"></span><span id="pct"></span>
  </div>
</div>

<div id="selLayer"></div>
<div id="selbar"><div class="colors" id="selColors"></div><div class="acts" id="selActs"></div></div>
<div id="scrim"></div>

<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sheet-head">
    <div class="h" id="sheetTitle">Агент</div>
    <button class="tb" id="sheetClose"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
  <div class="quote" id="sheetQuote"></div>
  <div id="sheetBody"></div>
  <div class="chips" id="sheetChips"></div>
  <div class="sheet-foot">
    <input id="sheetInput" placeholder="Уточнить…" autocomplete="off">
    <button class="send" id="sheetSend"><svg class="icon"><use href="#i-send"/></svg></button>
  </div>
</div>

<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="h" id="drawerTitle"></div>
    <button class="tb" id="drawerAct" style="display:none"></button>
    <button class="tb" id="drawerClose"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<div id="menu"></div>
<div id="toast"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
