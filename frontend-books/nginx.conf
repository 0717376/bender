server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # В mime.types nginx манифеста нет, а браузер ждёт именно этот тип.
    types { application/manifest+json webmanifest; }

    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /files {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 25m;
    }

    location /storage {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 300;
    }

    location /chat/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Книги подмонтированы с хоста. Отдельным блоком, потому что общий фолбэк ниже отдавал бы
    # на отсутствующий файл index.html с кодом 200 — и приложение считало бы книгу существующей.
    location /books/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # Имена собранных файлов содержат хеш — их можно кэшировать навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
