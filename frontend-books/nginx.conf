server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /files {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 25m;
    }

    location /storage {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 300;
    }

    location /chat/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Поток живой синхронизации: не буферизовать, иначе события копятся в nginx.
    # ^~ важнее блока /books ниже.
    location ^~ /books/events {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    # Библиотекой владеет бэкенд: список, файлы книг и обложки идут туда.
    location /books {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_read_timeout 300;
    }

    # Имена собранных файлов содержат хеш — их можно кэшировать навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Манифеста может не быть в mime.types — тогда сработает этот тип. Блоком types его
    # задавать нельзя: он заменяет всю карту типов, и остальное уезжает в octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
